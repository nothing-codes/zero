    </g>

    <path d="M40 320c6-74 48-116 120-116s114 42 120 116Z" fill="url(#body)"/>
    <path d="M40 320c6-74 48-116 120-116 14 0 27 1 39 4-52 8-84 48-89 112Z" fill="url(#rim)" opacity="0.35"/>

    <path d="M112 156c0-40 20-66 48-66s48 26 48 66v22c0 38-21 66-48 66s-48-28-48-66Z" fill="url(#skin)"/>
    <path d="M112 164c0-8 1-16 2-22 5 35 23 57 46 66-27 4-48-15-48-44Z" fill="#000000" opacity="0.16"/>

    <path d="M108 120c4-32 24-52 52-52s48 20 52 52c2 14-6 23-16 15-12-9-23-13-36-13s-24 4-36 13c-10 8-18-1-16-15Z" fill="#202020"/>
    <path d="M120 106c10-16 25-25 40-25 14 0 27 7 37 20-13-7-25-10-38-10-14 0-27 5-39 15Z" fill="#6b6b6b" opacity="0.45"/>

