    <ellipse cx="180" cy="160" rx="5.5" ry="3" fill="#181818"/>
    <path d="M151 184c6 4 12 4 18 0" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M156 170c2-3 6-3 8 0" stroke="#4a4a4a" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <path d="M113 150c-8-1-13 6-11 15 1 8 6 13 13 12Z" fill="#565656"/>
    <path d="M207 150c8-1 13 6 11 15-1 8-6 13-13 12Z" fill="#3f3f3f"/>

    <rect width="320" height="320" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:overlay"/>
